<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINGDOM OF ASH</title>
<style>
body{background:#111;color:white;text-align:center;font-family:Arial;padding:15px}
h1{color:orange;font-size:30px;margin:5px}
#kingdom{font-size:60px;margin:10px;min-height:70px}
#count{font-size:65px}
.stats{background:#222;padding:10px;border-radius:12px;margin:10px}
button{background:orange;color:white;border:none;padding:15px 20px;font-size:18px;border-radius:12px;margin:5px;width:90%}
button.green{background:#2ecc71}
button.blue{background:#3498db}
button.purple{background:#9b59b6}
.shop{background:#222;padding:12px;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<h1>🔥 KINGDOM OF ASH 🔥</h1>
<div id="kingdom">🏚️</div>
<p id="kingdomName">Ruined Land</p>

<div id="count">0</div>
<p>Ash Collected | Tap Power: <span id="tapPower">1</span></p>

<button onclick="gather()">🔥 GATHER ASH (+<span id="tapPower2">1</span>)</button>

<div class="stats">
<p>🪵 Wood: <span id="wood">0</span> | 🪨 Stone: <span id="stone">0</span></p>
<p>👷 Workers: <span id="workers">0</span> (+<span id="perSec">0</span>/sec)</p>
</div>

<div class="shop">
<h3>🏪 SHOP</h3>
<button onclick="buyWorker()">👷 Buy Worker - 10 Ash</button>
<button class="green" onclick="buyTap()">⚡ Stronger Hands - 100 Ash (Tap +1)</button>
<button class="blue" onclick="buyWood()">🪵 Buy Wood - 50 Ash</button>
<button class="purple" onclick="buyStone()">🪨 Buy Stone - 100 Ash</button>
<button onclick="build()">🏰 BUILD KINGDOM - 500 Ash</button>
<button onclick="resetGame()" style="background:#555;font-size:14px;padding:10px">Reset Game</button>
</div>
<p id="msg" style="color:#f1c40f"></p>

<script>
let ash = parseInt(localStorage.getItem('ash')||0);
let workers = parseInt(localStorage.getItem('workers')||0);
let tap = parseInt(localStorage.getItem('tap')||1);
let wood = parseInt(localStorage.getItem('wood')||0);
let stone = parseInt(localStorage.getItem('stone')||0);
let level = parseInt(localStorage.getItem('level')||0);

function save(){localStorage.setItem('ash',ash);localStorage.setItem('workers',workers);localStorage.setItem('tap',tap);localStorage.setItem('wood',wood);localStorage.setItem('stone',stone);localStorage.setItem('level',level);}
function update(){
document.getElementById("count").innerText=ash;
document.getElementById("workers").innerText=workers;
document.getElementById("perSec").innerText=workers;
document.getElementById("tapPower").innerText=tap;
document.getElementById("tapPower2").innerText=tap;
document.getElementById("wood").innerText=wood;
document.getElementById("stone").innerText=stone;
let k=document.getElementById("kingdom"); let n=document.getElementById("kingdomName");
if(level==0){k.innerText="🏚️"; n.innerText="Ruined Land";}
else if(level==1){k.innerText="🏚️🏠"; n.innerText="Small Village";}
else if(level==2){k.innerText="🏠🏠🏰"; n.innerText="Growing Town";}
else if(level>=3){k.innerText="🏰🏰🔥🏰"; n.innerText="KINGDOM OF ASH - REBUILT! 👑";}
save();
}
function gather(){ash+=tap; update();}
function buyWorker(){if(ash>=10){ash-=10;workers++;update();}else alert("Need 10 Ash!");}
function buyTap(){if(ash>=100){ash-=100;tap++;update();}else alert("Need 100 Ash!");}
function buyWood(){if(ash>=50){ash-=50;wood+=10;update();document.getElementById("msg").innerText="Got +10 Wood!";}else alert("Need 50 Ash!");}
function buyStone(){if(ash>=100){ash-=100;stone+=10;update();document.getElementById("msg").innerText="Got +10 Stone!";}else alert("Need 100 Ash!");}
function build(){if(ash>=500){ash-=500;level++;update();document.getElementById("msg").innerText="KINGDOM UPGRADED! 🎉";}else alert("Need 500 Ash to Build!");}
function resetGame(){if(confirm("Reset everything?")){ash=0;workers=0;tap=1;wood=0;stone=0;level=0;update();}}
setInterval(function(){if(workers>0){ash+=workers;update();}},1000);
update();
</script>
</body>
</html>
