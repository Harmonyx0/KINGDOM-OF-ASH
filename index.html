<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINGDOM OF ASH</title>
<style>
body{background:#111;color:white;text-align:center;font-family:Arial;padding:20px}
h1{color:orange;font-size:32px}
#count{font-size:70px;margin:10px}
button{background:orange;color:white;border:none;padding:20px 30px;font-size:22px;border-radius:12px;margin:10px}
.shop{background:#222;padding:15px;border-radius:12px;margin-top:20px}
</style>
</head>
<body>
<h1>🔥 KINGDOM OF ASH 🔥</h1>
<p>Your kingdom burned down. Rebuild it!</p>
<div id="count">0</div>
<p>Ash Collected</p>
<button onclick="gather()">🔥 GATHER ASH</button>

<div class="shop">
<h3>🏠 Shop</h3>
<p>Workers: <span id="workers">0</span> | Cost: 10 Ash</p>
<button onclick="buyWorker()">Buy Worker (+1 per sec)</button>
</div>

<script>
let ash = 0;
let workers = 0;
function gather(){
  ash = ash + 1;
  document.getElementById("count").innerText = ash;
}
function buyWorker(){
  if(ash >= 10){
    ash = ash - 10;
    workers = workers + 1;
    document.getElementById("count").innerText = ash;
    document.getElementById("workers").innerText = workers;
  } else {
    alert("Need 10 Ash! Keep tapping!");
  }
}
setInterval(function(){
  if(workers > 0){
    ash = ash + workers;
    document.getElementById("count").innerText = ash;
  }
}, 1000);
</script>
</body>
</html>
