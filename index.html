<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINGDOM OF ASH - ROK Style</title>
<style>
body{background:#0d1a0d;color:white;font-family:Arial;margin:0;padding:0;text-align:center}
.topbar{background:#1a2a1a;display:flex;justify-content:space-around;padding:8px;font-size:13px;position:sticky;top:0;z-index:10}
.topbar b{color:#f1c40f}
.city{background:#2d4a22;padding:10px;min-height:340px;position:relative}
.building{display:inline-block;background:#3a5a2a;border:2px solid #6a8a4a;border-radius:10px;padding:10px;margin:5px;width:90px;cursor:pointer}
.building b{font-size:12px}
.building .lv{color:#f1c40f;font-size:11px}
.map{display:none;background:#1e2e1e;padding:10px;min-height:340px}
.tile{display:inline-block;width:52px;height:52px;margin:2px;border-radius:8px;line-height:52px;font-size:24px;cursor:pointer;vertical-align:top}
.my{background:#2ecc71}
.enemy{background:#e74c3c}
.res{background:#f39c12}
.empty{background:#34495e}
.fog{background:#222}
.bottombar{background:#111;display:flex;position:fixed;bottom:0;left:0;right:0}
.bottombar button{flex:1;background:#222;color:white;border:none;padding:15px;font-size:15px}
.bottombar button.active{background:orange}
button.action{background:orange;color:white;border:none;padding:12px 20px;border-radius:10px;margin:5px;font-size:15px}
.card{background:#222;padding:12px;margin:10px;border-radius:12px;text-align:left}
</style>
</head>
<body>
<div class="topbar">
<div>🌾 <b id="food">1000</b></div>
<div>🪵 <b id="wood">1000</b></div>
<div>🪨 <b id="stone">500</b></div>
<div>🪙 <b id="gold">200</b></div>
<div>⚡ <b id="power">0</b></div>
</div>

<div style="padding:5px">👑 KINGDOM OF ASH <span id="chName">| City Hall Lv.<span id="chLv">1</span></span></div>

<!-- CITY VIEW -->
<div id="cityView" class="city">
<div style="font-size:40px">🏰</div>
<p>Tap a building to UPGRADE</p>
<div id="buildings"></div>
<div class="card">
<h3>⚔️ Train Troops</h3>
<p>Troops: <b id="troops">0</b> | Marching: <span id="marching">None</span></p>
<button class="action" onclick="train(1)">+1 Infantry (100 Food)</button>
<button class="action" onclick="train(10)">+10 Infantry (1000 Food)</button>
<button class="action" style="background:#2ecc71" onclick="trainArcher()">+1 Archer (100 Wood)</button>
<p id="cityMsg" style="color:#f1c40f"></p>
</div>
</div>

<!-- MAP VIEW -->
<div id="mapView" class="map">
<p>🗺️ WORLD MAP - Tap a tile to Gather / Attack</p>
<p>Your troops: <b id="troops2">0</b> | Selected: <span id="sel">None</span></p>
<div id="mapGrid"></div>
<p id="mapMsg" style="color:#f1c40f;min-height:20px"></p>
<button class="action" onclick="returnTroops()">↩️ Recall Troops</button>
</div>

<div style="height:60px"></div>
<div class="bottombar">
<button id="btnCity" class="active" onclick="show('city')">🏰 City</button>
<button id="btnMap" onclick="show('map')">🗺️ Map</button>
<button onclick="showHelp()">❓ Help</button>
</div>

<script>
let R = JSON.parse(localStorage.getItem('koa_rok')||'{"food":1000,"wood":1000,"stone":500,"gold":200,"troops":0,"archers":0,"buildings":{"hall":1,"farm":1,"lumber":1,"quarry":1,"mine":1,"barracks":1}}');
let marching = null;
let mapData = [];
// 6x6 map: 0 empty, 1 you, 2 barbarian, 3 food, 4 wood, 5 stone, 6 gold
let layout = [
[0,3,2,0,4,0],
[5,0,0,2,0,6],
[0,2,1,0,3,0],
[4,0,0,0,2,5],
[0,6,3,0,0,2],
[2,0,4,5,0,3]
];
function save(){localStorage.setItem('koa_rok',JSON.stringify(R));}
function cost(lv){return lv*500;}
function renderCity(){
let b=R.buildings;
let html='';
let defs=[['hall','🏰','City Hall'],['farm','🌾','Farm'],['lumber','🪵','Lumber Mill'],['quarry','🪨','Quarry'],['mine','🪙','Gold Mine'],['barracks','⚔️','Barracks']];
defs.forEach(d=>{
html+=`<div class="building" onclick="upgrade('${d[0]}')"><div style="font-size:28px">${d[1]}</div><b>${d[2]}</b><br><span class="lv">Lv.${b[d[0]]}</span><br><span style="font-size:11px">Up: ${cost(b[d[0]])} 🪵</span></div>`;
});
document.getElementById('buildings').innerHTML=html;
document.getElementById('chLv').innerText=b.hall;
document.getElementById('food').innerText=Math.floor(R.food);
document.getElementById('wood').innerText=Math.floor(R.wood);
document.getElementById('stone').innerText=Math.floor(R.stone);
document.getElementById('gold').innerText=Math.floor(R.gold);
document.getElementById('troops').innerText=R.troops+R.archers;
document.getElementById('troops2').innerText=R.troops+R.archers;
let power = b.hall*100 + b.farm*50 + b.barracks*80 + (R.troops+R.archers)*10;
document.getElementById('power').innerText=power;
save();
}
function upgrade(type){
let lv=R.buildings[type]; let c=cost(lv);
if(R.wood>=c){R.wood-=c; R.buildings[type]++; document.getElementById('cityMsg').innerText=type+' upgraded to Lv.'+R.buildings[type]+'!';}
else{alert('Need '+c+' Wood! Build Lumber Mill higher to get more wood.');}
renderCity(); renderMap();
}
function train(n){
let c=n*100;
if(R.food>=c){R.food-=c; R.troops+=n; document.getElementById('cityMsg').innerText='+'+n+' Infantry trained!';}
else alert('Need '+c+' Food!');
renderCity();
}
